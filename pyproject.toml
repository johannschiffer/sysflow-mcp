[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysflow-mcp"
version = "1.0.0"
description = "Safe Linux Sysadmin, Process & Build Automation Engine for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "sysadmin", "linux", "systemd", "claude", "cursor", "monitoring", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sysflow-mcp = "sysflow.server:main"
sysflow-cli = "sysflow.cli:main"

[tool.setuptools.packages.find]
include = ["sysflow*"]

[project.urls]
Homepage = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/sysflow-mcp"
"Starter Kit" = "https://johanld.gumroad.com/l/genesis-starter-kit"
"Enterprise Suite" = "https://johanld.gumroad.com/l/genesis-enterprise-suite"
