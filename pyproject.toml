[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysflow-mcp"
version = "2.0.0"
description = "Safe Linux administration plane, systemd inspection, port auditing, and isolated task execution for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "sysadmin", "linux", "systemd", "claude", "cursor", "monitoring", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sysflow-mcp = "sysflow.server:main"
sysflow-cli = "sysflow.cli:main"

[tool.setuptools.packages.find]
include = ["sysflow*"]

[project.urls]
"Support / Donate" = "https://ko-fi.com/johannschiffer"
"Documentation" = "https://johannschiffer.github.io"
Funding = "https://github.com/sponsors/johannschiffer"
Homepage = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/sysflow-mcp"
