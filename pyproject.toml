[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysflow-mcp"
version = "2.0.1"
description = "Linux system inspection, systemd unit generation, port auditing, and timeout-bounded task execution MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "sysadmin", "linux", "systemd", "claude", "cursor", "monitoring", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sysflow-mcp = "sysflow.server:main"
sysflow-cli = "sysflow.cli:main"

[tool.setuptools.packages.find]
include = ["sysflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/johannschiffer/sysflow-mcp"
Documentation = "https://github.com/johannschiffer/sysflow-mcp#readme"
Repository = "https://github.com/johannschiffer/sysflow-mcp"
Issues = "https://github.com/johannschiffer/sysflow-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"
