services:
  sysflow:
    build: .
    container_name: genesis-sysflow
    restart: unless-stopped
    stdin_open: true
    tty: true
    pid: host
    security_opt: ["no-new-privileges:true"]
    environment:
      SYSFLOW_PROC_DIR: /host-proc
    volumes:
      - /var/log:/var/log:ro
      - /proc:/host-proc:ro
